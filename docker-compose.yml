# Generic Docker Compose deployment for the ShogiBench coordination server,
# for a VPS or any always-on box. Put a reverse proxy (Caddy, nginx) with
# HTTPS in front of it, and set the env vars below accordingly.
#
#   OPENBENCH_SECRET_KEY=$(python3 -c 'import secrets; print(secrets.token_urlsafe(50))') \
#   docker compose up -d --build
#   docker compose exec web python manage.py invite <username> --approver

services:
  web:
    build:
      context: .
      dockerfile: Deploy/server/Dockerfile
    ports:
      - '8000:8000'
    environment:
      OPENBENCH_SECRET_KEY: ${OPENBENCH_SECRET_KEY:?generate one and keep it stable}
      OPENBENCH_DATA_DIR: /data
      OPENBENCH_ALLOWED_HOSTS: ${OPENBENCH_ALLOWED_HOSTS:-*}
      OPENBENCH_CSRF_TRUSTED_ORIGINS: ${OPENBENCH_CSRF_TRUSTED_ORIGINS:-}
    volumes:
      - shogibench-data:/data
    restart: unless-stopped

volumes:
  shogibench-data:
