# Fly.io configuration for the ShogiBench coordination server.
#
# First deploy:
#   fly launch --no-deploy            # or edit the app name below
#   fly volumes create shogibench_data --size 3
#   fly secrets set OPENBENCH_SECRET_KEY=$(python3 -c 'import secrets; print(secrets.token_urlsafe(50))')
#   fly deploy
#   fly scale count 1                 # SQLite requires exactly one machine
#   fly ssh console -C 'python /app/manage.py invite <username> --approver'
#
# Update OPENBENCH_ALLOWED_HOSTS / OPENBENCH_CSRF_TRUSTED_ORIGINS if you
# rename the app or attach a custom domain.

app = 'shogibench'
primary_region = 'nrt'

[build]
  dockerfile = 'Deploy/server/Dockerfile'

[env]
  OPENBENCH_DATA_DIR = '/data'
  OPENBENCH_ALLOWED_HOSTS = 'shogibench.fly.dev'
  OPENBENCH_CSRF_TRUSTED_ORIGINS = 'https://shogibench.fly.dev'
  WEB_CONCURRENCY = '2'

[mounts]
  source = 'shogibench_data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  # Workers polling the server will keep it awake while tests run. Set
  # min_machines_running = 1 if you prefer the UI to never cold-start.
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
