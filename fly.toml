# fly.toml app configuration file generated for shogibench on 2026-07-06T03:49:28Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'shogibench'
primary_region = 'nrt'

[build]
  dockerfile = 'Deploy/server/Dockerfile'

[env]
  OPENBENCH_ALLOWED_HOSTS = 'shogibench.fly.dev'
  OPENBENCH_CSRF_TRUSTED_ORIGINS = 'https://shogibench.fly.dev'
  OPENBENCH_DATA_DIR = '/data'
  WEB_CONCURRENCY = '2'

[[mounts]]
  source = 'shogibench_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
